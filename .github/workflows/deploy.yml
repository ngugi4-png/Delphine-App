name: Deploy to Firebase

# Runs automatically on every push to main — no manual `firebase deploy`
# needed once the FIREBASE_SERVICE_ACCOUNT secret below is set up.
on:
  push:
    branches:
      - main
  workflow_dispatch: # also allows a manual "Run workflow" button in GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase (hosting + functions)
        run: firebase deploy --project delphine-b4214 --non-interactive
