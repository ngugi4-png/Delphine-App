const ALL_ITEM_KEYS = CRITERIA_GROUPS.flatMap(g => g.items.map(i => i.key));
const DEFAULT_SCORES = Object.fromEntries(ALL_ITEM_KEYS.map(k => [k, 0]));
function makeId() {
  return "site_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
}

// Converts a ward's registered-voter count into a 0-5 score by quintile rank
// against all 95 wards — high voter density scores higher, on the reasoning that
// more registered residents in a ward broadly means more potential customers.
// This is a coarse proxy, not a substitute for on-the-ground demand assessment.
const VOTER_VALUES_SORTED = Object.values(WARD_VOTERS).slice().sort((a, b) => a - b);
function voterCountToScore(count) {
  if (count == null) return null;
  let rank = 0;
  for (const v of VOTER_VALUES_SORTED) {
    if (count >= v) rank++;
  }
  const pct = rank / VOTER_VALUES_SORTED.length;
  return Math.min(5, Math.max(0, Math.round(pct * 5)));
}
function computeWeightedScore(scores) {
  let total = 0;
  let maxTotal = 0;
  CRITERIA_GROUPS.forEach(group => {
    const itemCount = group.items.length;
    const groupMax = itemCount * 5;
    const groupRaw = group.items.reduce((sum, item) => sum + (scores[item.key] || 0), 0);
    const groupPct = groupMax > 0 ? groupRaw / groupMax : 0;
    total += groupPct * group.weight;
    maxTotal += group.weight;
  });
  return Math.round(total / maxTotal * 1000) / 10; // out of 100, 1 decimal
}
function tierFor(score) {
  if (score >= 75) return {
    label: "Prime",
    color: "#1A6B3C",
    bg: "#E7F5EC"
  };
  if (score >= 55) return {
    label: "Strong",
    color: "#B8860B",
    bg: "#FBF3DC"
  };
  if (score >= 35) return {
    label: "Marginal",
    color: "#B45309",
    bg: "#FDF0E1"
  };
  return {
    label: "Weak",
    color: "#9B2C2C",
    bg: "#FCE9E9"
  };
}
function SiteScout() {
  const [sites, setSites] = useState([]);
  const [loading, setLoading] = useState(true);

  const [saveError, setSaveError] = useState(null);
  const [activeTab, setActiveTab] = useState("sites"); // "sites" | "marketCenters"
  const [visitLog, setVisitLog] = useState({}); // { [siteId]: isoDateVisited }
  const [visitLogDay, setVisitLogDay] = useState(null); // the "visit day" the log currently belongs to
  const [proxyUrl, setProxyUrl] = useState("");
  const [showSettings, setShowSettings] = useState(false);
  const [pendingConfirm, setPendingConfirm] = useState(null); // "autofill" | "reset" | null
  const [nearbyResults, setNearbyResults] = useState({}); // { [siteId]: { loading, error, places } }
  const [editingCoords, setEditingCoords] = useState(null); // siteId currently editing lat/lng

  const STORAGE_KEY = "sites-v5"; // bumped: added verified coordinates for 8 major towns (sourced from Wikipedia)
  const VISIT_LOG_KEY = "visit-log-v1";

  // The "visit day" flips at 12:00 local time rather than midnight, so a visit
  // logged this morning still counts today, but the log clears once noon passes.
  const getVisitDayId = () => {
    const now = new Date();
    const boundary = new Date(now);
    boundary.setHours(12, 0, 0, 0);
    const dayBase = now < boundary ? new Date(now.getTime() - 86400000) : now;
    return dayBase.toISOString().slice(0, 10); // YYYY-MM-DD of the current visit-day
  };
  const freshSeed = () => SEED_SITES.map(s => ({
    id: makeId(),
    name: s.name,
    constituency: s.constituency,
    ward: s.ward,
    note: s.note,
    scores: {
      ...DEFAULT_SCORES
    },
    bodaBodaScore: 0,
    // 0-5, filled in by you from what you observe on the ground
    lat: s.lat ?? null,
    // only present for sources with a confirmed public coordinate
    lng: s.lng ?? null,
    createdAt: Date.now()
  }));

  // Load from storage on mount
  useEffect(() => {
    (async () => {
      try {
        const result = await window.storage.get(STORAGE_KEY, false);
        if (result && result.value) {
          const parsed = JSON.parse(result.value);
          // guard against corrupted/empty saved data
          if (Array.isArray(parsed) && parsed.length > 0) {
            setSites(parsed);
          } else {
            setSites(freshSeed());
          }
        } else {
          setSites(freshSeed());
        }
      } catch (e) {
        setSites(freshSeed());
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  // Persist on change (skip initial load)
  useEffect(() => {
    if (loading) return;
    (async () => {
      try {
        const result = await window.storage.set(STORAGE_KEY, JSON.stringify(sites), false);
        if (!result) setSaveError("Could not save — changes may not persist.");else setSaveError(null);
      } catch (e) {
        setSaveError("Could not save — changes may not persist.");
      }
    })();
  }, [sites, loading]);

  // Load visit log on mount, resetting it if the stored log belongs to a previous visit-day
  useEffect(() => {
    (async () => {
      const today = getVisitDayId();
      try {
        const result = await window.storage.get(VISIT_LOG_KEY, false);
        if (result && result.value) {
          const parsed = JSON.parse(result.value);
          if (parsed && parsed.day === today) {
            setVisitLog(parsed.visits || {});
            setVisitLogDay(today);
            return;
          }
        }
      } catch (e) {
        // fall through to fresh log
      }
      setVisitLog({});
      setVisitLogDay(today);
    })();
  }, []);

  // Recheck every few minutes so the log clears automatically once noon passes
  // while the app stays open, not just on next page load.
  useEffect(() => {
    const interval = setInterval(() => {
      const today = getVisitDayId();
      if (today !== visitLogDay) {
        setVisitLog({});
        setVisitLogDay(today);
      }
    }, 60000);
    return () => clearInterval(interval);
  }, [visitLogDay]);

  // Persist visit log on change
  useEffect(() => {
    if (visitLogDay === null) return;
    (async () => {
      try {
        await window.storage.set(VISIT_LOG_KEY, JSON.stringify({
          day: visitLogDay,
          visits: visitLog
        }), false);
      } catch (e) {
        // non-critical, ignore
      }
    })();
  }, [visitLog, visitLogDay]);
  const markVisited = siteId => {
    setVisitLog(prev => ({
      ...prev,
      [siteId]: true
    }));
  };
  const unmarkVisited = siteId => {
    setVisitLog(prev => {
      const next = {
        ...prev
      };
      delete next[siteId];
      return next;
    });
  };
  const updateBodaBodaScore = (siteId, value) => {
    setSites(prev => prev.map(s => s.id === siteId ? {
      ...s,
      bodaBodaScore: Number(value)
    } : s));
  };
  const updateCoords = (siteId, lat, lng) => {
    setSites(prev => prev.map(s => s.id === siteId ? {
      ...s,
      lat: lat === "" ? null : Number(lat),
      lng: lng === "" ? null : Number(lng)
    } : s));
  };

  // Load the person's own proxy URL (never a raw Google API key) on mount
  useEffect(() => {
    (async () => {
      try {
        const result = await window.storage.get("proxy-url-v1", false);
        if (result && result.value) setProxyUrl(result.value);
      } catch (e) {
        // no saved proxy yet, ignore
      }
    })();
  }, []);
  const saveProxyUrl = async url => {
    setProxyUrl(url);
    try {
      await window.storage.set("proxy-url-v1", url, false);
    } catch (e) {
      // non-critical
    }
  };

  // Calls the person's own backend proxy (never Google directly — browsers can't
  // call the Places API with a raw key without exposing it and hitting CORS).
  // Expected proxy contract: GET {proxyUrl}?lat=..&lng=..&radius=..&type=gas_station
  // returning the Places Nearby Search JSON response unmodified.
  const searchNearby = async site => {
    if (!proxyUrl) {
      setShowSettings(true);
      return;
    }
    if (site.lat == null || site.lng == null) {
      setNearbyResults(prev => ({
        ...prev,
        [site.id]: {
          loading: false,
          error: "Add latitude/longitude for this center first.",
          places: null
        }
      }));
      return;
    }
    setNearbyResults(prev => ({
      ...prev,
      [site.id]: {
        loading: true,
        error: null,
        places: null
      }
    }));
    try {
      const url = `${proxyUrl}?lat=${site.lat}&lng=${site.lng}&radius=1500&type=gas_station`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Proxy returned ${res.status}`);
      const data = await res.json();
      const places = (data.results || []).map(p => ({
        name: p.name,
        address: p.vicinity || p.formatted_address || "",
        rating: p.rating,
        openNow: p.opening_hours ? p.opening_hours.open_now : undefined
      }));
      setNearbyResults(prev => ({
        ...prev,
        [site.id]: {
          loading: false,
          error: null,
          places
        }
      }));
    } catch (e) {
      setNearbyResults(prev => ({
        ...prev,
        [site.id]: {
          loading: false,
          error: "Could not reach proxy. Check the URL in Settings.",

        }

  const updateScore = (siteId, itemKey, value) => {

  const autoFillPopulation = siteId => {
    setSites(prev => prev.map(s => {
      if (s.id !== siteId) return s;
      const key = `${s.constituency}||${s.ward}`;

      const voters = WARD_VOTERS[key];
